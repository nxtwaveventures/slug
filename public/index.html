<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>slug — consultation scribe</title>
  <style>
    :root { --bg:#0f1720; --card:#172230; --ink:#e8eef5; --muted:#93a2b4; --line:#26374a;
            --accent:#3ba776; --danger:#c0503f; --warn:#e0a53b; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
           background:var(--bg); color:var(--ink); line-height:1.5; }
    main { max-width:560px; margin:0 auto; padding:28px 20px 48px; text-align:center; }
    h1 { margin:0; font-size:26px; }
    .sub { color:var(--muted); font-size:14px; margin:6px 0 28px; }
    .consent { font-size:13px; color:var(--warn); background:rgba(224,165,59,.08);
               border:1px solid rgba(224,165,59,.3); border-radius:10px; padding:10px 12px; margin-bottom:24px; }

    /* one big button */
    #mic { width:180px; height:180px; border-radius:50%; border:none; cursor:pointer;
           background:var(--accent); color:#fff; font-size:20px; font-weight:700;
           display:inline-flex; align-items:center; justify-content:center; flex-direction:column; gap:8px;
           box-shadow:0 10px 30px rgba(0,0,0,.35); transition:transform .1s, background .2s; }
    #mic:active { transform:scale(.97); }
    #mic .icon { font-size:44px; line-height:1; }
    #mic.recording { background:var(--danger); animation:pulse 1.3s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{ box-shadow:0 0 0 0 rgba(192,80,63,.5);} 50%{ box-shadow:0 0 0 22px rgba(192,80,63,0);} }
    #mic:disabled { opacity:.5; cursor:default; animation:none; }
    #status { margin-top:18px; color:var(--muted); font-size:15px; min-height:22px; }

    /* results */
    #results { margin-top:28px; text-align:left; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:16px; }
    h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 12px; }
    .draft-tag { display:inline-block; font-size:10px; font-weight:700; color:#111; background:var(--warn);
                 padding:2px 7px; border-radius:20px; margin-left:6px; vertical-align:middle; }
    label { display:block; font-size:12px; color:var(--muted); margin-bottom:5px; }
    textarea { width:100%; background:#0e1620; color:var(--ink); border:1px solid var(--line);
               border-radius:10px; padding:10px; font-size:15px; resize:vertical; }
    .field { margin-bottom:12px; }
    ul { margin:0; padding-left:20px; } li { margin-bottom:8px; }
    .transcript { white-space:pre-wrap; font-size:14px; color:var(--muted); max-height:200px; overflow:auto; }
    .hidden { display:none; }

    /* access gate (only shown if a code is required) */
    #gate { position:fixed; inset:0; background:var(--bg); display:none; align-items:center; justify-content:center; padding:20px; z-index:10; }
    #gate.show { display:flex; }
    #gate .box { width:100%; max-width:360px; text-align:center; }
    #gate input { width:100%; padding:14px; font-size:16px; border-radius:10px; text-align:center;
                  border:1px solid var(--line); background:#0e1620; color:var(--ink); margin:16px 0 12px; }
    #gate button { width:100%; padding:14px; font-size:16px; font-weight:600; border:none; border-radius:10px; background:#2f6dd0; color:#fff; cursor:pointer; }
    #gateErr { color:var(--danger); font-size:13px; min-height:18px; margin-top:10px; }
  </style>
</head>
<body>
  <main>
    <h1>slug</h1>
    <p class="sub">Records the consultation and drafts notes for the doctor to verify.</p>
    <p class="consent">First, tell the patient the talk is being recorded to help the doctor, and get their OK.</p>

    <button id="mic">
      <span class="icon">🎤</span>
      <span id="micLabel">Tap to start</span>
    </button>
    <div id="status">Ready.</div>

    <div id="results" class="hidden">
      <div class="card">
        <h2>Summary <span class="draft-tag">DRAFT — VERIFY</span></h2>
        <div class="field"><label>Main complaint</label><textarea id="chief" rows="2"></textarea></div>
        <div class="field"><label>History</label><textarea id="history" rows="3"></textarea></div>
        <div class="field"><label>Symptoms</label><textarea id="symptoms" rows="2"></textarea></div>
        <div class="field"><label>Medicines mentioned</label><textarea id="meds" rows="2"></textarea></div>
        <div class="field"><label>Notes</label><textarea id="notes" rows="2"></textarea></div>
      </div>
      <div class="card">
        <h2>Questions to ask <span class="draft-tag">DRAFT</span></h2>
        <ul id="questions"></ul>
      </div>
      <div class="card">
        <h2>Full transcript</h2>
        <div id="transcript" class="transcript"></div>
      </div>
    </div>
  </main>

  <div id="gate">
    <div class="box">
      <h1>slug</h1>
      <p class="sub">Enter the access code.</p>
      <input id="code" type="password" autocomplete="off" placeholder="Access code" />
      <button id="enter">Enter</button>
      <div id="gateErr"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
